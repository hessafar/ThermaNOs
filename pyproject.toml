[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermano"
version = "1.0.0"
description = "Thermal Neural Operators: physics-informed and data-driven DeepONet surrogates for the transient heat equation in laser powder bed fusion"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hesam Safari", email = "he.safari@gmail.com" }]
keywords = ["scientific machine learning", "DeepONet", "PINN", "heat transfer", "additive manufacturing", "surrogate model"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "h5py>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "pre-commit>=3.5"]
viz = ["matplotlib>=3.7"]

[project.scripts]
thermano = "thermano.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: longer-running convergence / training checks (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]
